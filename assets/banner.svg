<svg viewBox="0 0 1200 300" width="1200" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Strudel Workspace — live-coded music by Baylox and IGSparkew">
  <title>Strudel Workspace</title>
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#0d1424"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="gTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="gBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gWaveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gPlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurXL" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#8b9bb4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="14"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, 'Cascadia Code', 'Segoe UI Mono', Consolas, Menlo, monospace; }
      @keyframes eq { 0%, 100% { transform: scaleY(0.30); } 50% { transform: scaleY(1); } }
      .b  { transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.20s ease-in-out infinite; }
      .b2 { animation-duration: 1.50s; animation-delay: 0.15s; }
      .b3 { animation-duration: 0.95s; animation-delay: 0.30s; }
      .b4 { animation-duration: 1.80s; animation-delay: 0.45s; }
      .b5 { animation-duration: 1.10s; animation-delay: 0.60s; }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes sweep { from { transform: translateX(-20px); } to { transform: translateX(1220px); } }
      .playhead { animation: sweep 9s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -64; } }
      .flow { stroke-dasharray: 2 14; animation: flow 1.6s linear infinite; stroke-linecap: round; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <!-- fond -->
    <rect x="0" y="0" width="1200" height="300" fill="url(#gBg)"/>
    <ellipse cx="170" cy="30" rx="270" ry="130" fill="#7c3aed" opacity="0.30" filter="url(#blurXL)"/>
    <ellipse cx="1040" cy="270" rx="290" ry="140" fill="#06b6d4" opacity="0.22" filter="url(#blurXL)"/>
    <ellipse cx="620" cy="310" rx="300" ry="110" fill="#ec4899" opacity="0.12" filter="url(#blurXL)"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#grid)"/>

    <!-- décorations -->
    <text class="mono" x="150" y="96" font-size="18" fill="#67e8f9" opacity="0.18">+</text>
    <text class="mono" x="1058" y="76" font-size="18" fill="#a78bfa" opacity="0.18">+</text>
    <text class="mono" x="936" y="238" font-size="18" fill="#f472b6" opacity="0.15">+</text>
    <text class="mono" x="86" y="226" font-size="18" fill="#a78bfa" opacity="0.14">+</text>

    <!-- égaliseur -->
    <g>
      <rect class="b"    x="35"   y="274" width="14" height="34"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b2" x="71"   y="260" width="14" height="48"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b3" x="107"  y="268" width="14" height="40"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b4" x="143"  y="245" width="14" height="63"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b5" x="179"  y="254" width="14" height="54"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b3" x="215"  y="232" width="14" height="76"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b2" x="251"  y="260" width="14" height="48"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b4" x="287"  y="240" width="14" height="68"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b5" x="323"  y="226" width="14" height="82"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b"    x="359"  y="248" width="14" height="60"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b3" x="395"  y="214" width="14" height="94"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b2" x="431"  y="236" width="14" height="72"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b5" x="467"  y="208" width="14" height="100" rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b4" x="503"  y="224" width="14" height="84"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b2" x="539"  y="240" width="14" height="68"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b3" x="575"  y="212" width="14" height="96"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b5" x="611"  y="210" width="14" height="98"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b"    x="647"  y="236" width="14" height="72"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b4" x="683"  y="220" width="14" height="88"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b3" x="719"  y="208" width="14" height="100" rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b2" x="755"  y="232" width="14" height="76"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b5" x="791"  y="216" width="14" height="92"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b4" x="827"  y="244" width="14" height="64"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b"    x="863"  y="228" width="14" height="80"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b3" x="899"  y="212" width="14" height="96"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b2" x="935"  y="250" width="14" height="58"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b5" x="971"  y="234" width="14" height="74"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b4" x="1007" y="258" width="14" height="50"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b3" x="1043" y="242" width="14" height="66"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b2" x="1079" y="264" width="14" height="44"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b b5" x="1115" y="254" width="14" height="54"  rx="4" fill="url(#gBar)" opacity="0.85"/>
      <rect class="b"    x="1151" y="272" width="14" height="36"  rx="4" fill="url(#gBar)" opacity="0.85"/>
    </g>

    <!-- ondes -->
    <path d="M -20 246 Q 30 214 80 246 T 180 246 T 280 246 T 380 246 T 480 246 T 580 246 T 680 246 T 780 246 T 880 246 T 980 246 T 1080 246 T 1180 246 T 1280 246"
          fill="none" stroke="url(#gWaveA)" stroke-width="2.5" opacity="0.45"/>
    <path class="flow" d="M -70 246 Q -20 278 30 246 T 130 246 T 230 246 T 330 246 T 430 246 T 530 246 T 630 246 T 730 246 T 830 246 T 930 246 T 1030 246 T 1130 246 T 1230 246"
          fill="none" stroke="#67e8f9" stroke-width="2.5" opacity="0.5"/>

    <!-- tête de lecture -->
    <g class="playhead">
      <rect x="-7" y="0" width="14" height="300" fill="url(#gPlay)" opacity="0.16"/>
      <rect x="-1.5" y="0" width="3" height="300" fill="url(#gPlay)" opacity="0.75"/>
    </g>

    <!-- textes -->
    <text class="mono" x="36" y="46" font-size="17" fill="#64748b">// Strudel-Workspace — live set</text>
    <text class="mono" x="1164" y="46" font-size="17" fill="#67e8f9" opacity="0.85" text-anchor="end">$: play</text>

    <text class="mono" x="600" y="152" font-size="64" font-weight="700" text-anchor="middle" letter-spacing="5">
      <tspan fill="#e8edf7">STRUDEL</tspan><tspan fill="url(#gTitle)"> WORKSPACE</tspan><tspan class="cursor" dx="14" fill="#67e8f9">█</tspan>
    </text>
    <text class="mono" x="600" y="190" font-size="20" text-anchor="middle" letter-spacing="2" fill="#9aa7bd">live-coded music  ·  Baylox × IGSparkew</text>
  </g>

  <!-- liseré -->
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
